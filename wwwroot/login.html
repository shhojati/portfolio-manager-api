<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Portfolio Backoffice</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M7 21l6-6 4 4 8-9' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    try { const t = localStorage.getItem('pm.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/login.js"></script>
</head>
<body class="login-body">
  <main class="login">
    <div class="brand login-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8"/><path d="M7 21l6-6 4 4 8-9"/></svg>
      </span>
      <span class="brand-text">
        <strong>Portfolio Manager</strong>
        <small>Backoffice</small>
      </span>
    </div>

    <form class="card login-card" id="login-form" novalidate>
      <h1>Sign in</h1>
      <p class="muted">Admin accounts only.</p>

      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <label class="check">
        <input type="checkbox" name="remember">
        Keep me signed in on this device
      </label>

      <div class="error-box" id="login-error" role="alert" hidden></div>

      <button type="submit" class="btn btn-primary login-submit">Sign in</button>
    </form>
  </main>
</body>
</html>
