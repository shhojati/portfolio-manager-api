name: Deploy to Liara

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two deploys at once; a newer push cancels the older one.
concurrency:
  group: liara-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Liara CLI
        run: npm install -g @liara/cli@9

      # Uploads the source and Liara builds the image from the Dockerfile on its own builders.
      # Pulling a prebuilt image from ghcr.io does not work: ghcr.io is unreachable from Iran and the release times out.
      # app, port and disks come from liara.json.
      - name: Deploy to Liara
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: liara deploy --api-token "$LIARA_TOKEN" --no-app-logs
