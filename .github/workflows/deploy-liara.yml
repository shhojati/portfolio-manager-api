name: Deploy to Liara

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two deploys at once; a newer push cancels the older one.
concurrency:
  group: liara-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      # Compile here: Liara's builders cannot reach nuget.org, so dotnet restore times out there.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish app
        run: dotnet publish PortfolioManager.Api.csproj -c Release -r linux-x64 --no-self-contained -o publish -p:UseAppHost=false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Liara CLI
        run: npm install -g @liara/cli@9

      # Uploads the source plus publish/, and Liara builds Dockerfile.liara, which only copies publish/.
      # A prebuilt image from ghcr.io cannot be used: ghcr.io is unreachable from Iran.
      # app, port and disks come from liara.json.
      - name: Deploy to Liara
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: liara deploy --api-token "$LIARA_TOKEN" --dockerfile Dockerfile.liara --no-app-logs
