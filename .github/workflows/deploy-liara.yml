name: Build & deploy to Liara

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two deploys at once; a newer push cancels the older one.
concurrency:
  group: liara-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with GITHUB_TOKEN

    steps:
      - uses: actions/checkout@v4

      # ghcr.io image names must be lowercase.
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Liara CLI
        run: npm install -g @liara/cli@9

      # app, port and disks come from liara.json; Liara pulls the image by its exact commit tag.
      - name: Deploy to Liara
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
        run: liara deploy --api-token "$LIARA_TOKEN" --image "$IMAGE:${{ github.sha }}" --no-app-logs
